data_ingestion:
  test_size: 0.20

model_building:
  # from experiments 2–3: TF-IDF with 1- to 3-word n-grams, 1000 features
  ngram_range: [1, 3]
  max_features: 1000
  # from experiment 4: oversample the minority classes with SMOTE
  oversample: true
  # from experiment 5 (Optuna search on LightGBM); the course uses 0.09 / 20 / 367
  learning_rate: 0.09
  max_depth: 20
  n_estimators: 367
